name: Stage-1 full run (shard-backed, resumable)
git_sha: 1ceb9d161e1f654da96b1f57b31724e48ac29250
revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
weight_sha256:
  model-00001-of-00002.safetensors: 41a8895c164b4d32bae6b302f4603fcbc1797f32dafa45c7e9bcda23c6755df8
  model-00002-of-00002.safetensors: 365531ff8752420e89dee707b79d021fb2d6e25abafe486f080555a4fe6972e4
seed: 26168
device: cuda
precision: fp16
attention: sdpa
vision_fp32: false
# Step counts are computed from measured T4 throughput by scripts/run_stage1_full.py,
# never read from here. These stay null on purpose: a placeholder number is worse
# than no number, and run_full refuses to start without --throughput-json.
steps: null
max_steps_per_session: null
# Budget the plan is computed against: budget_seconds x measured_samples_per_second
# / (batch_size x gradient_accumulation_steps) = max_optimizer_steps.
budget_seconds: 180000
checkpoint_every_steps: 500
eval_every_steps: 2000
eval_patches: 2000
batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
lora:
  r: 32
  alpha: 64
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
learning_rates:
  vision: 1.0e-05
  patch_embed: 0.0001
  lm_lora: 0.0001
optimizer: adafactor
scheduler: cosine
warmup_fraction: 0.03
grad_clip_norm: 1.0
# 11 h guard: the Kaggle session limit is 12 h and the final checkpoint plus the
# results JSON are written before the guard fires.
wall_clock_limit_seconds: 39600
wall_clock_reserve_seconds: 300
resume: true
log:
- loss
- samples_per_second
- peak_memory_bytes
- wall_clock_seconds
contract: norm_contract.json