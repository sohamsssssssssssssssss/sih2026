# Shared defaults. Every experiment config inherits from this via `extends: base`.
# Never edit this to make one experiment work — override in the child config.

run:
  seed: 1337
  output_dir: results
  log_every: 25
  checkpoint_every: 500      # Kaggle sessions die at 12h; this is not optional
  resume_from: null

hardware:
  # T4 (Turing) profile. Switch these on Blackwell.
  precision: fp16            # bf16 unavailable on T4
  attn_implementation: sdpa  # flash_attention_2 needs Ampere+
  gradient_checkpointing: true
  device_map: auto

model:
  backbone: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true

lora:
  enabled: false             # baseline runs with no adapter
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  lr: 2.0e-4
  vision_lr: 1.0e-5          # pretrained features move gently
  new_param_lr: 1.0e-4       # randomly-initialised modules move faster
  weight_decay: 0.01
  warmup_ratio: 0.03
  scheduler: cosine
  epochs: 2
  per_device_batch_size: 1
  grad_accum_steps: 32       # effective batch 32
  max_grad_norm: 1.0         # fp16 needs this

data:
  tile_format_version: 2     # bump when B1 changes the schema
  ann_type: null             # null = all; caption|vqa|refexp filters the BEN.txt view
  image_size: 448
  # Stage 2 work, NOT deferrable to Stage 3: the resolution ladder is what the
  # PS actually grades, and fusion tuned at one GSD does not transfer to five.
  multiscale_gsd: []         # e.g. [0.3, 1.0, 2.0, 5.0, 10.0]

eval:
  suites: [rsvqa]
  limit: 500
  max_new_tokens: 16
